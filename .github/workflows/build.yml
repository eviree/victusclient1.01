name: Build Victus Client mod

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.m.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "targets=$(ls versions | sed 's/\.properties$//' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.1 }
      - name: Build ${{ matrix.target }}
        run: gradle -Ptarget=${{ matrix.target }} build --no-daemon
      - name: Collect jar
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -1)
          cp "$JAR" "dist/victusclient-${{ matrix.target }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: dist/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: dist
      - name: Generate versions.json
        run: python3 scripts/make_manifest.py "${{ github.ref_name }}" "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/versions.json
